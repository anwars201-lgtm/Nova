# Lingkungan build di device ini (lihat .harness/memory/workspace-capabilities.md)
# Gradle bawaan repo memakai native lib glibc, jadi native services harus dimatikan.
org.gradle.native=false
org.gradle.daemon=false
org.gradle.jvmargs=-Xmx3g -Djava.io.tmpdir=/data/user/0/com.androidharness.app/files/.harness-scratch/tmp
org.gradle.parallel=false

android.useAndroidX=true
# build-tools resmi Google untuk Linux bersifat x86_64, aapt2-nya tidak bisa jalan di ARM.
android.aapt2FromMavenOverride=/data/user/0/com.androidharness.app/files/linux/bin/aapt2
